version: '3.8'

services:
  # ── MongoDB Database (Persistent Storage) ──
  mongodb:
    image: mongo:7
    container_name: hc01-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hospital-queue
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis (Scalability & Job Scheduling) ──
  redis:
    image: redis:7-alpine
    container_name: hc01-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Microservice (FastAPI Clinical Decision Support) ──
  ai:
    build:
      context: ./ai
      dockerfile: ../docker/Dockerfile.ai
    container_name: hc01-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - AI_HOST=0.0.0.0
      - AI_PORT=8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Backend Server (Node.js Express + Socket.IO) ──
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: hc01-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/hospital-queue
      - JWT_SECRET=${JWT_SECRET:-mediqueue-production-jwt-secret-replace-with-env}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-sih-admin-secret-key-2026}
      - AI_URL=http://ai:8001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://localhost:80}
    depends_on:
      mongodb:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend Client (Nginx Reverse Proxy & Static SPA) ──
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: hc01-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    name: hc01_mongodb_data
